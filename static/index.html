<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subnet Viewer</title>
<link rel="icon" href="/logo.jpg">
<link rel="apple-touch-icon" href="/logo.jpg">
<script>
  // Apply a saved Light/Dark choice before first paint so reloads don't flash.
  try {
    const saved = localStorage.getItem("subnet-viewer:theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch { /* storage blocked: follow the device */ }
</script>
<style>
  :root {
    color-scheme: light;
    /* Material's default light palette. */
    --page: #f5f5f5;
    --surface: #ffffff;
    --ink: rgba(0, 0, 0, 0.87);
    --ink-2: rgba(0, 0, 0, 0.6);
    --hairline: rgba(0, 0, 0, 0.04);
    --divider: rgba(0, 0, 0, 0.12);
    --skeleton: rgba(0, 0, 0, 0.08);
    --shimmer: rgba(0, 0, 0, 0.03);
    --rule: rgba(0, 0, 0, 0.23);
    --border: rgba(0, 0, 0, 0.12);
    --good: #2e7d32;
    --bad: #d32f2f;
    --accent: #1976d2;
    --accent-soft: rgba(25, 118, 210, 0.08);
    --immune: #ed6c02;
    /* Emission-split bar: owner / vali-root / vali-alpha / miner. Distinct hues, validated for CVD. */
    --split-owner: #c9a200;
    --split-vroot: #0ca678;
    --split-valpha: #e03131;
    --split-miner: #2563eb;
    --logo-bg: #ffffff;
    --shadow-1: 0 2px 1px -1px rgba(0, 0, 0, 0.2), 0 1px 1px rgba(0, 0, 0, 0.14), 0 1px 3px rgba(0, 0, 0, 0.12);
    --shadow-8: 0 5px 5px -3px rgba(0, 0, 0, 0.2), 0 8px 10px 1px rgba(0, 0, 0, 0.14), 0 3px 14px 2px rgba(0, 0, 0, 0.12);
    --shadow-24: 0 11px 15px -7px rgba(0, 0, 0, 0.2), 0 24px 38px 3px rgba(0, 0, 0, 0.14), 0 9px 46px 8px rgba(0, 0, 0, 0.12);
  }
  /* Dark palette: when the device prefers dark (unless Light is chosen), or when Dark is chosen. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      /* Material's default dark palette: #121212 page, #1e1e1e paper. */
      --page: #121212;
      --surface: #1e1e1e;
      --ink: #ffffff;
      --ink-2: rgba(255, 255, 255, 0.7);
      --hairline: rgba(255, 255, 255, 0.08);
      --divider: rgba(255, 255, 255, 0.12);
      --skeleton: rgba(255, 255, 255, 0.11);
      --shimmer: rgba(255, 255, 255, 0.05);
      --rule: rgba(255, 255, 255, 0.23);
      --border: rgba(255, 255, 255, 0.12);
      --good: #66bb6a;
      --bad: #f44336;
      --accent: #90caf9;
      --accent-soft: rgba(144, 202, 249, 0.12);
      --immune: #ffa726;
      --split-owner: #f5c518;
      --split-vroot: #20c997;
      --split-valpha: #fa5252;
      --split-miner: #4c8dff;
      --logo-bg: #e0e0e0;
      --shadow-1: 0 2px 1px -1px rgba(0, 0, 0, 0.4), 0 1px 1px rgba(0, 0, 0, 0.28), 0 1px 3px rgba(0, 0, 0, 0.24);
      --shadow-8: 0 5px 5px -3px rgba(0, 0, 0, 0.4), 0 8px 10px 1px rgba(0, 0, 0, 0.28), 0 3px 14px 2px rgba(0, 0, 0, 0.24);
      --shadow-24: 0 11px 15px -7px rgba(0, 0, 0, 0.4), 0 24px 38px 3px rgba(0, 0, 0, 0.28), 0 9px 46px 8px rgba(0, 0, 0, 0.24);
    }
  }
  :root[data-theme="dark"] {
      color-scheme: dark;
    /* Material's default dark palette: #121212 page, #1e1e1e paper. */
    --page: #121212;
    --surface: #1e1e1e;
    --ink: #ffffff;
    --ink-2: rgba(255, 255, 255, 0.7);
    --hairline: rgba(255, 255, 255, 0.08);
    --divider: rgba(255, 255, 255, 0.12);
    --skeleton: rgba(255, 255, 255, 0.11);
    --shimmer: rgba(255, 255, 255, 0.05);
    --rule: rgba(255, 255, 255, 0.23);
    --border: rgba(255, 255, 255, 0.12);
    --good: #66bb6a;
    --bad: #f44336;
    --accent: #90caf9;
    --accent-soft: rgba(144, 202, 249, 0.12);
    --immune: #ffa726;
    --split-owner: #f5c518;
    --split-vroot: #20c997;
    --split-valpha: #fa5252;
    --split-miner: #4c8dff;
    --logo-bg: #e0e0e0;
    --shadow-1: 0 2px 1px -1px rgba(0, 0, 0, 0.4), 0 1px 1px rgba(0, 0, 0, 0.28), 0 1px 3px rgba(0, 0, 0, 0.24);
    --shadow-8: 0 5px 5px -3px rgba(0, 0, 0, 0.4), 0 8px 10px 1px rgba(0, 0, 0, 0.28), 0 3px 14px 2px rgba(0, 0, 0, 0.24);
    --shadow-24: 0 11px 15px -7px rgba(0, 0, 0, 0.4), 0 24px 38px 3px rgba(0, 0, 0, 0.28), 0 9px 46px 8px rgba(0, 0, 0, 0.24);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    /* Material's font stack, taken from what is installed rather than fetched. */
    font: 400 14px/1.43 Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: 0.01071em;
  }
  main { max-width: 1720px; margin: 0 auto; padding: 0 16px 32px; }

  /* The same bar on every page: brand, the pages, then whatever that page needs. */
  /* One app bar across every page: full width, its own paper, dense toolbar. */
  .appbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 14px 16px 6px; margin: 0 0 16px;
    background: var(--surface); box-shadow: var(--shadow-1);
  }
  .brand-title { margin: 0; font-size: 20px; font-weight: 500; line-height: 1.6; }
  .brandlink { display: inline-flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; }
  .brand { flex: none; width: 30px; height: 30px; border-radius: 6px; position: relative; isolation: isolate; display: block; }
  .brand img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  /* A conic-gradient ring turns slowly around the brand mark; faster on hover. */
  .brand::before {
    content: ""; position: absolute; inset: -2px; border-radius: 8px; z-index: -1;
    background: conic-gradient(from 0deg, #1976d2, #7c4dff, #e91e63, #1976d2);
    animation: brand-spin 6s linear infinite;
  }
  .brandlink:hover .brand::before { animation-duration: 2s; }
  @keyframes brand-spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .brand::before { animation: none; } }
  .navlinks { display: flex; gap: 2px; }
  /* TAO's USD price beside the page links: a quiet chip, its 24h change in green or red. */
  .tao-price {
    display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; border-radius: 16px;
    background: var(--hairline); color: var(--ink); font-size: 0.8125rem; text-decoration: none; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .tao-price:hover { background: var(--divider); }
  .tao-price .tao-name { color: var(--ink-2); font-size: 0.75rem; }
  .tao-price b { font-weight: 600; }
  .tao-price .up { color: var(--good); }
  .tao-price .down { color: var(--bad); }
  /* Material's text button; the page you are on is marked the way tabs are. */
  .navbtn {
    display: inline-flex; align-items: center; white-space: nowrap;
    padding: 6px 10px; border: 0; border-radius: 4px 4px 0 0; background: none;
    color: var(--ink-2); text-decoration: none;
    font-size: 0.875rem; font-weight: 500; line-height: 1.75;
    letter-spacing: 0.02857em; text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
  }
  .navbtn:hover { background: var(--hairline); color: var(--ink); }
  .navbtn.current { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .navbtn.current:hover { background: var(--accent-soft); color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
  .actions label, .hint { color: var(--ink-2); }
  /* Ring counting down to the next update; click it to update now. */
  .tick {
    display: grid; place-items: center; padding: 4px; border-radius: 50%;
    color: var(--ink-2); line-height: 0;
  }
  .tick:hover { background: var(--hairline); color: var(--ink); }
  .tick svg { width: 18px; height: 18px; }
  .tick circle { fill: none; stroke-width: 3; }
  .tick .track { stroke: var(--divider); }
  .tick .ring { stroke: var(--accent); transition: stroke-dashoffset 1s linear; }
  /* While the cards reload, the ring becomes a spinning arc instead of a countdown. */
  .tick.busy .ring { transition: none; }
  .tick.busy svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .tick.busy svg { animation-duration: 2.4s; } }
  /* Seed Lab password box, shown over the dashboard before going there. */
  /* Material's dialog: paper at elevation 24, title, content, then the actions. */
  .login {
    width: min(360px, calc(100vw - 64px)); padding: 16px 24px 8px; color: var(--ink);
    background: var(--surface); border: 0; border-radius: 4px; box-shadow: var(--shadow-24);
  }
  .login::backdrop { background: rgba(0, 0, 0, 0.5); }
  .login h2 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 500; line-height: 1.6; }
  .login p { margin: 0 0 16px; color: var(--ink-2); }
  .login input {
    width: 100%; font: inherit; color: var(--ink); background: none;
    border: 1px solid var(--rule); border-radius: 4px; padding: 8.5px 14px;
  }
  .login input:hover { border-color: var(--ink); }
  .login .login-error { margin: 8px 0 0; color: var(--bad); }
  .login-actions { display: flex; justify-content: flex-end; gap: 8px; margin: 8px -16px 0; padding: 8px; }
  /* Text buttons for the actions, contained for the one that commits. */
  .login-actions button {
    padding: 6px 8px; min-width: 64px; color: var(--accent);
    font-size: 0.875rem; font-weight: 500; letter-spacing: 0.02857em; text-transform: uppercase;
  }
  .login-actions button:hover { background: var(--accent-soft); }
  .login-actions .primary {
    padding: 6px 16px; background: var(--accent); color: var(--surface); box-shadow: var(--shadow-1);
  }
  .login-actions .primary:hover { background: var(--accent); filter: brightness(1.08); box-shadow: var(--shadow-8); }
  .login-actions button:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  /* The registration-fee burn graph, opened from the Reg fee group. */
  .burn-dialog { width: min(1040px, calc(100vw - 48px)); max-height: calc(100vh - 32px); overflow: auto; }
  /* Under the fee graph: registrations per day for a month, then the registration facts as chips. */
  .reg-bars-head { display: flex; justify-content: space-between; gap: 12px; margin: 16px 0 4px; padding-top: 16px; border-top: 1px solid var(--divider); color: var(--ink-2); font-size: 0.8125rem; }
  .reg-bars-head b { color: var(--ink); font-weight: 600; }
  .reg-bars { min-height: 150px; display: grid; place-items: center; margin-inline: -8px; }
  .reg-bars svg { width: 100%; height: auto; display: block; }
  .reg-bar { fill: #a05070; }
  .reg-bar.today { opacity: 0.55; }
  .reg-bar.on { fill: #c5628a; opacity: 1; }
  /* Registration facts at the top of the dialog: small cards, label over value. */
  .reg-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--divider); }
  @media (max-width: 640px) { .reg-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .reg-chip {
    display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 10px 12px;
    border: 1px solid var(--divider); border-radius: 4px; background: var(--hairline);
  }
  .reg-chip span { color: var(--ink-2); font-size: 0.75rem; line-height: 1.3; }
  .reg-chip b { color: var(--ink); font-size: 0.9375rem; font-weight: 600; line-height: 1.3;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reg-chip.good b { color: var(--good); }
  .reg-chip.bad b { color: var(--bad); }
  .burn-sub { margin: -4px 0 14px; color: var(--ink-2); font-size: 0.875rem; }
  /* Pull the chart out to the dialog's action-row edges (16px) so it lines up with the Close button. */
  .burn-chart { min-height: 340px; display: grid; place-items: center; margin: 14px -8px 0; }
  .burn-chart svg { width: 100%; height: auto; display: block; }
  .burn-msg { color: var(--ink-2); margin: 0; padding: 56px 0; }
  .burn-axis { fill: var(--ink-2); font-size: 11px; }
  .burn-grid { stroke: var(--divider); stroke-width: 1; }
  /* Drawn the way TaoMarketCap charts it: a thin line through every block, no fill. */
  .burn-line { fill: none; stroke: #c5628a; stroke-width: 1.5; stroke-linejoin: round; }
  .burn-dot { fill: #c5628a; }
  .burn-min { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 4 3; }
  .burn-min-label { fill: var(--ink-2); font-size: 10px; }
  .burn-now rect { fill: var(--surface); stroke: var(--ink-2); }
  .burn-now text { fill: var(--ink); font-size: 10.5px; font-weight: 600; }
  .burn-hit { fill: transparent; cursor: crosshair; }
  .burn-crosshair { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
  .burn-tip rect { fill: var(--surface); stroke: var(--ink-2); }
  .burn-tip-fee { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .burn-tip-time { fill: var(--ink-2); font-size: 10px; }
  /* MUI's ToggleButtonGroup: outlined buttons sharing their borders, the chosen one tinted primary. */
  .theme { display: inline-flex; }
  .theme button {
    height: 40px; margin: 0; padding: 0 11px; border: 1px solid var(--divider); border-radius: 0;
    background: none; color: var(--ink-2); font-size: 0.8125rem; font-weight: 500; line-height: 1.75;
    letter-spacing: 0.02857em; text-transform: uppercase; transition: background-color 150ms, color 150ms;
  }
  .theme button + button { margin-left: -1px; border-left-color: transparent; }
  .theme button:first-child { border-radius: 4px 0 0 4px; }
  .theme button:last-child { border-radius: 0 4px 4px 0; }
  .theme button:hover { background: var(--hairline); color: var(--ink); }
  .theme button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .theme button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* MUI's outlined Select (size small): the label floats in a notch in the border,
     the drop arrow sits at the end, and focus turns border and label primary. */
  .mui-select { position: relative; display: inline-flex; max-width: 100%; }
  .mui-select select {
    appearance: none; -webkit-appearance: none; height: 40px; min-width: 120px; padding: 0 32px 0 14px;
    font: inherit; font-size: 1rem; color: var(--ink); background: transparent; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 4px; transition: border-color 150ms;
  }
  .mui-select select option { background: var(--surface); color: var(--ink); }
  .mui-select select:hover { border-color: var(--ink); }
  .mui-select select:focus { outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .mui-select label {
    position: absolute; left: 9px; top: 0; transform: translateY(-50%); padding: 0 5px; pointer-events: none;
    background: var(--surface); color: var(--ink-2); font-size: 0.75rem; line-height: 1; transition: color 150ms;
  }
  .mui-select select:focus + label { color: var(--accent); }
  .mui-arrow {
    position: absolute; right: 7px; top: 50%; width: 24px; height: 24px; transform: translateY(-50%);
    fill: var(--ink-2); pointer-events: none;
  }
  /* An outlined select, the shape Material gives its inputs. */
  select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--rule); border-radius: 4px; padding: 7px 10px; max-width: 100%;
  }
  select:hover { border-color: var(--ink); }
  button {
    font: inherit; color: var(--ink); background: none; border: 0; border-radius: 4px;
    padding: 6px 8px; cursor: pointer;
  }
  button:hover { background: var(--hairline); }
  /* Clicking something should not leave a ring around it. Keyboard focus still
     shows one, and inputs mark focus the way Material does: a primary border. */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  select:focus, input:focus, dialog:focus { outline: none; }
  select:focus-visible, input:focus-visible {
    outline: none; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
  }
  .error { color: var(--bad); margin: 0 0 12px; }
  .hint { margin: 0; }

  .grid {
    display: grid; gap: 24px; align-items: start; /* every card is the same row-count tall (short tables pad out), so align to the top rather than stretch a card past its content */
    grid-template-columns: repeat(auto-fill, minmax(min(520px, 100%), 1fr));
  }
  .card {
    --pad: 16px;
    --rows-h: 240px;  /* height of the miner area: ~5 rows; the empty state fills the same, so every card is one height */
    display: flex; flex-direction: column;
    background: var(--surface); border: 0; border-radius: 4px; box-shadow: var(--shadow-1);
    padding: 12px var(--pad) 14px; transition: opacity 0.15s, box-shadow 0.2s;
  }
  /* Clean layout: one line under the header; spacing, not lines, separates the rest. */
  .bar {
    margin-inline: calc(-1 * var(--pad)); padding-inline: var(--pad); padding-bottom: 12px;
    min-height: 63px;  /* ~150% of the one-line height, giving the price sparkline room */
    border-bottom: 1px solid var(--divider);
  }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Controls stay quiet until needed: the drag handle shows on hover (always on touch screens). */
  .bar { position: relative; }
  @media (hover: hover) {
    /* Out of the header's flow, in the card's left gutter, so it costs the title no room. */
    .card .handle { position: absolute; left: calc(var(--pad) / 2 - 6px); margin: 0; padding: 0; font-size: 15px; opacity: 0; transition: opacity 0.15s; }
    .card:hover .handle, .card .handle:focus-visible { opacity: 1; }
  }
  /* Refreshes dim the card and keep its numbers; only the first load shows a skeleton. */
  .card.loading:not(.pending) { opacity: 0.55; }
  /* Not on the watch list: outlined rather than lifted, so it reads as a preview. */
  .card.preview { box-shadow: none; outline: 1px dashed var(--rule); outline-offset: -1px; }
  /* Blank cards that fill out the last row, so an incomplete row leaves no hole. */
  .card-filler {
    align-self: stretch; min-height: 160px; display: grid; place-content: center; justify-items: center; gap: 6px;
    border: 1px dashed var(--rule); border-radius: 4px; color: var(--ink-2); font-size: 0.8125rem; opacity: 0.7;
  }
  .card-filler svg { width: 32px; height: 32px; }
  .card.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent), var(--shadow-1); } to { box-shadow: 0 0 0 3px transparent, var(--shadow-1); } }
  @media (prefers-reduced-motion: reduce) { .card.flash { animation: none; } }

  .bar { display: flex; align-items: center; gap: 8px; }
  /* Long names wrap rather than truncate, so the 🛡️ badge is never cut off. */
  .bar h2 {
    flex: 1; min-width: 0; margin: 0; font-size: 1.25rem; font-weight: 500;
    line-height: 1.25; overflow-wrap: anywhere;
  }
  .handle {
    border: 0; background: none; padding: 2px 4px; margin-left: -4px; color: var(--ink-2);
    font-size: 18px; line-height: 1; cursor: grab; touch-action: none;
  }
  .card.preview .handle { display: none; }
  .card.dragging { opacity: 0.9; box-shadow: 0 0 0 2px var(--accent), var(--shadow-8); }
  body.reordering, body.reordering * { cursor: grabbing !important; user-select: none; }
  .logo {
    flex: none; display: grid; place-items: center; width: 30px; height: 30px; overflow: hidden;
    border: 1px solid var(--border); border-radius: 50%; background: var(--hairline);
    color: var(--ink-2); font-size: 15px; font-weight: 600;
  }
  /* Logos sit on white so dark artwork stays visible in dark mode. */
  .logo.has-img { background: var(--logo-bg); }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  /* Icon buttons: round, with the usual hover wash. */
  .icon-link {
    flex: none; display: grid; place-items: center; width: 30px; height: 30px;
    border-radius: 50%; color: var(--ink-2); opacity: 0.8;
  }
  .icon-link:hover { background: var(--hairline); color: var(--ink); opacity: 1; }
  .star { border: 0; background: none; padding: 4px 8px; margin-right: -4px; border-radius: 16px; color: var(--ink-2); white-space: nowrap; font-size: 0.8125rem; }
  .star[aria-pressed="true"] { color: var(--ink); font-size: 17px; line-height: 1.2; }

  /* Price, reg fee and burn: three equal groups, each marked by a bar on its left. */
  .stats {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px;
    margin-block: 0 16px; padding-block: 14px 0;
  }
  .stat { display: flex; flex-direction: column; min-width: 0; padding-left: 10px; border-left: 3px solid var(--rule); }
  /* The Reg fee group opens its last-day burn graph; mark it as clickable. */
  .stat.tappable { cursor: pointer; border-radius: 0 4px 4px 0; }
  .stat.tappable:hover { background: var(--hairline); }
  .stat.tappable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .stat.tappable .stat-label { text-decoration: underline dotted; text-underline-offset: 2px; text-decoration-color: var(--accent); }
  .stat-label { color: var(--ink-2); font-size: 12px; line-height: 1.3; }
  /* Where the subnet is in its epoch (one runs every `tempo` blocks), between the stats and the miners. */
  /* The bar alone, tucked under the stats (which keep a 16px margin below); details on hover. */
  .epoch { display: flex; margin: -12px 0 14px; cursor: help; }
  .epoch-bar { flex: 1; height: 3px; border-radius: 2px; background: var(--hairline); overflow: hidden; }
  .epoch-fill { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--accent); }
  /* Where this subnet's alpha price ranks among all subnets: #1 is the dearest. */
  .rank { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; cursor: help; }
  .stat-line { white-space: nowrap; }
  .stat-value { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .stat-value.tight { font-size: 14px; } /* set by fitStats() for values too long for their group */
  .stat-value.good { color: var(--good); } /* e.g. Emission while the subnet receives any */
  /* The 24h change (or burn amount) always sits on its own line, so every card has the same shape. */
  .delta { display: block; min-height: 1.3em; color: var(--ink-2); font-size: 13px; line-height: 1.3; }
  .delta.good { color: var(--good); }
  .delta.bad { color: var(--bad); }

  /* The table takes the card's leftover height, so the totals line lands at the bottom
     even when a subnet has fewer than five miners. */
  /* Capped at ~5 rows' worth (thead 28 + 5*31 + tfoot 57); extra miners scroll,
     so adding more to the list never makes the card taller. */
  .table-wrap { overflow: auto; flex: 1; max-height: var(--rows-h); scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  /* A slim scrollbar in WebKit/Blink to match scrollbar-width: thin elsewhere. */
  .table-wrap::-webkit-scrollbar { width: 7px; height: 7px; }
  .table-wrap::-webkit-scrollbar-track { background: transparent; }
  .table-wrap::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
  .table-wrap::-webkit-scrollbar-thumb:hover { background: var(--ink-2); }
  /* Header and totals stay pinned while the miner rows scroll between them. The
     opaque background keeps rows from showing through (the table collapses borders,
     so an inset shadow draws the divider that a sticky cell border wouldn't keep). */
  thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 0; box-shadow: inset 0 -1px 0 var(--divider); }
  /* Each header sorts the card's miners: one click for its natural order, another to flip.
     The arrow hangs into the padding beside the label, so sorting never moves a column. */
  th .sort {
    position: relative; margin: 0; padding: 0; border: 0; background: none; cursor: pointer;
    font: inherit; line-height: inherit; letter-spacing: inherit; color: inherit;
  }
  th .sort:hover { color: var(--ink); }
  th .sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  thead th[aria-sort] { z-index: 3; color: var(--ink); } /* above its neighbour, whose padding the arrow overhangs */
  th[aria-sort] .sort::after {
    content: "▼"; position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
    margin-left: 2px; color: var(--accent); font-size: 8px;
  }
  th[aria-sort="ascending"] .sort::after { content: "▲"; }
  th:last-child[aria-sort] .sort::after { left: auto; right: 100%; margin: 0 2px 0 0; } /* no padding to its right */
  tfoot td { position: sticky; bottom: 0; z-index: 2; background: var(--surface); }
  /* The week's alpha price, drawn faintly behind the card header (always there,
     even for a subnet with no miners and so an empty table). */
  .spark { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .spark-line { fill: none; stroke: var(--ink-2); stroke-width: 1.5; opacity: 0.4; vector-effect: non-scaling-stroke; }
  .spark.up .spark-line { stroke: var(--good); }
  .spark.down .spark-line { stroke: var(--bad); }
  /* Area: a gradient from the line's colour down to transparent at the bottom. */
  .spark-area { fill: url(#spark-grad-down); }
  .spark.up .spark-area { fill: url(#spark-grad-up); }
  .spark.down .spark-area { fill: url(#spark-grad-down); }
  .bar > :not(.spark) { position: relative; }  /* header contents sit above the sparkline */
  table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 1.3; }
  th, td { text-align: left; padding: 6px 6px; white-space: nowrap; border-bottom: 1px solid var(--divider); }
  tbody tr:hover > td { background: var(--hairline); }
  tbody tr.pad:hover > td { background: none; }  /* empty padding rows don't react to hover */
  th:first-child, td:first-child { padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  th { color: var(--ink-2); font-weight: 500; font-size: 12px; letter-spacing: 0.01em; }
  /* Totals may wrap after the slash on narrow screens instead of overflowing. */
  tfoot td { border-top: 1px solid var(--divider); border-bottom: 0; padding-top: 8px; font-weight: 500; white-space: normal; }
  /* Totals row: the active-miner count ("30 miners") on the left, then the
     emission-split bar with its labels aligned beneath, filling the gap before
     the share / Daily-TAO columns. */
  tfoot td { vertical-align: top; }
  .total-main { display: flex; align-items: flex-start; gap: 14px; }
  .total-main .tl-text { flex: none; white-space: nowrap; padding-top: 1px; }
  .esplit { flex: 1; min-width: 0; }
  .esplit-bar { display: flex; gap: 3px; height: 9px; margin-bottom: 6px; }
  .esplit-bar .seg { border-radius: 3px; min-width: 3px; }
  .esplit-legend { display: flex; justify-content: space-between; gap: 6px; }
  .esplit-legend .li { display: flex; flex-direction: column; gap: 1px; min-width: 0; font-weight: 400; }
  .esplit-legend .li .name { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--ink); white-space: nowrap; }
  .esplit-legend .li .name i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .esplit-legend .li .pct { font-size: 10px; color: var(--ink-2); padding-left: 11px; }
  .seg-owner { background: var(--split-owner); }
  .seg-vroot { background: var(--split-vroot); }
  .seg-valpha { background: var(--split-valpha); }
  .seg-miner { background: var(--split-miner); }
  .muted { color: var(--ink-2); font-weight: 400; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .age { color: var(--ink-2); cursor: help; }
  /* UID colour says whether a miner can be deregistered: green yes, brown while immune. */
  .uid { font-weight: 600; color: var(--good); cursor: help; }
  .uid.immune { color: var(--immune); }
  .hotkey {
    font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: none; border: 0; border-radius: 4px; padding: 1px 3px; margin: -1px -3px; color: var(--ink-2);
  }
  /* Coldkey labelling: the key shows a saved label (or the short address) and a pencil
     that opens the editor; the pencil stays quiet until the row is hovered. */
  .ck-cell { display: inline-flex; align-items: center; gap: 2px; min-width: 0; max-width: 100%; }
  .ck { text-decoration: none; cursor: pointer; }
  .ck:not(.labeled):hover { text-decoration: underline; }
  .ck.labeled {
    min-width: 0; max-width: 84px; font-family: inherit; font-weight: 500; color: cornflowerblue;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* A gloss sweeps across the cornflowerblue label so it "shines"; falls back to solid
     cornflowerblue where gradient text isn't supported or motion is reduced. */
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .ck.labeled {
      background: linear-gradient(110deg, cornflowerblue 38%, #f0f6ff 50%, cornflowerblue 62%);
      background-size: 220% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: ck-shine 2.6s linear infinite;
    }
  }
  @keyframes ck-shine { to { background-position: -220% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .ck.labeled { animation: none; background: none; color: cornflowerblue; -webkit-text-fill-color: cornflowerblue; }
  }
  .ck-edit {
    flex: none; border: 0; background: none; color: var(--ink-2); cursor: pointer;
    font-size: 12px; line-height: 1; padding: 2px 3px; border-radius: 4px;
  }
  .ck-edit:hover { background: var(--hairline); color: var(--ink); }
  .ck-count { flex: none; margin-left: 2px; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; cursor: default; }
  .ck-addr { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink-2); word-break: break-all; }
  @media (hover: hover) {
    .ck-edit { opacity: 0; transition: opacity 0.15s; }
    tbody tr:hover .ck-edit, .ck-edit:focus-visible { opacity: 1; }
  }
  /* Owner chip, right-aligned in the header: total balance / locked. Details on hover, Taostats on click. */
  /* Material's small chip. */
  .owner-chip {
    flex: none; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px;
    border-radius: 16px; background: var(--hairline); color: var(--ink);
    font-size: 0.8125rem; font-weight: 400; white-space: nowrap; text-decoration: none;
  }
  .owner-chip:hover { background: var(--divider); }
  .chip-sep { color: var(--ink-2); font-weight: 400; }
  .badge { margin-left: 4px; cursor: help; }
  .shield { width: 1em; height: 1em; vertical-align: -0.14em; }
  .card-error { margin: 2px 0 0; font-size: 14px; color: var(--bad); }
  .body { flex: 1; display: flex; flex-direction: column; }
  .empty {
    flex: 1; display: grid; place-items: center; min-height: var(--rows-h); margin: 0;
    color: var(--ink-2); font-size: 20px; font-weight: 500; text-align: center; cursor: default;
  }

  .sk, .card.pending .logo {
    background: linear-gradient(90deg, var(--skeleton) 30%, var(--shimmer) 50%, var(--skeleton) 70%);
    background-size: 300% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
  }
  .sk { display: block; border-radius: 4px; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .sk, .card.pending .logo { animation: none; } }
  /* Percentage widths so the placeholders fit each of the five (sometimes narrow) stat cells. */
  .sk-label { width: 70%; max-width: 40px; height: 10px; margin: 4px 0 6px; }
  .sk-value { width: 90%; max-width: 92px; height: 20px; }
  .sk-rows { display: grid; gap: 11px; padding-top: 6px; }
  .sk-row { height: 14px; }
  .sk-row:nth-child(odd) { width: 94%; }
  .card-error { color: var(--bad); }

  @media (max-width: 480px) {
    .card { --pad: 8px; }
    .bar h2 { font-size: 18px; }
    /* Phones: the owner chip drops to its own line (still right-aligned), so names keep the first line. */
    .bar { flex-wrap: wrap; row-gap: 0; }
    .bar::after { content: ""; order: 98; flex-basis: 100%; }
    .owner-chip { order: 99; margin: 4px 0 0 auto; padding: 2px 7px; font-size: 11px; }
    th, td { padding-inline: 3px; }
    /* Four groups don't fit a phone's width, so they wrap to two by two. */
    .stats { gap: 8px 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 12px; }
    .stat { padding-left: 8px; }
    .stat-value { font-size: 16px; }
  }
</style>
