              <th scope="col" class="num" title="How long ago this hotkey registered on the subnet. Not the same as how long it has been earning, which the chain does not record"><button type="button" class="sort" data-sort="age">Age</button></th>
              <th scope="col" class="num" title="Each miner's share of the subnet's incentive, from the chain's consensus ranking — the figure Taostats shows. Hover a cell for its share of emission instead"><button type="button" class="sort" data-sort="incentive">Incentive</button></th>
              <th scope="col" class="num" title="What this miner earns a day at its current weights: its share of the miners' slice of the subnet's alpha emission (the split read live from the chain, shown below the table). Hover a cell to see what the chain last recorded paying"><button type="button" class="sort" data-sort="daily">Daily TAO</button></th>
            </tr>
          </thead>
          <tbody data-field="miners"></tbody>
          <tfoot>
            <tr>
              <td colspan="5" data-field="total-label"></td>
              <td class="num" data-field="total-share"></td>
              <td class="num" data-field="total-tao"></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <p class="empty" data-field="empty" hidden>No emission</p>
    </div>
  </article>
</template>

<script>
  const $ = (id) => document.getElementById(id);
  const REFRESH_MS = 60_000;
  const WATCH_KEY = "subnet-viewer:watchlist";
  const SORT_KEY = "subnet-viewer:sort";
  const LABELS_KEY = "subnet-viewer:coldkey-labels";

  const MINER_ROWS = 5;  // rows a card shows before scrolling; short tables pad to this
  const MINER_COLS = 7;  // UID, Hotkey, Coldkey, Balance, Registered, Incentive, Daily TAO
  const grid = $("grid");
  const cards = new Map(); // netuid -> card
  let subnetInfo = new Map(); // netuid -> {name, symbol, price_tao, price_rank}
  let rankedCount = 0; // how many subnets have a price rank, for "#3 of 128"
  let emittingCount = 0; // how many have an emission rank
  const SORTS = ["netuid", "price", "emission"];
  let sortBy = loadSort(); // one of SORTS
  let watch = loadWatch(); // newest first
  let labels = loadLabels(); // coldkey (ss58) -> user's label, this browser only
  let selected = Number(new URLSearchParams(location.search).get("netuid")) || null;
  if (!selected && watch.length === 0) selected = 1;

  // The watch list lives in this browser only; without storage it lasts the visit.
  function loadWatch() {
    try {
      const saved = JSON.parse(localStorage.getItem(WATCH_KEY) || "[]");
      return Array.isArray(saved) ? saved.filter(Number.isInteger) : [];
    } catch {
      return [];
    }
  }
  function saveWatch() {
    try {
      localStorage.setItem(WATCH_KEY, JSON.stringify(watch));
    } catch { /* storage blocked */ }
  }

  // Coldkey labels also live in this browser only, keyed by the full ss58 address so
  // the same account reads the same label on every subnet it appears in.
  function loadLabels() {
    try {
      const saved = JSON.parse(localStorage.getItem(LABELS_KEY) || "{}");
      return new Map(Object.entries(saved).filter(([, v]) => typeof v === "string" && v));
    } catch {
      return new Map();
    }
  }
  function saveLabels() {
    try {
      localStorage.setItem(LABELS_KEY, JSON.stringify(Object.fromEntries(labels)));
    } catch { /* storage blocked */ }
  }

  function loadSort() {
    try {
      const saved = localStorage.getItem(SORT_KEY);
      return SORTS.includes(saved) ? saved : "netuid";
    } catch {
      return "netuid";
    }
  }

  function num(v) {
    const abs = Math.abs(v);
    if (abs === 0) return "0";
    if (abs >= 1000) return v.toLocaleString("en-US", { maximumFractionDigits: 0 });
    if (abs >= 1) return v.toLocaleString("en-US", { maximumFractionDigits: 2 });
    return v.toLocaleString("en-US", { maximumSignificantDigits: 4 });
  }
  const tao = (v) => (v == null ? "—" : `τ${num(v)}`);
  // Table columns keep two decimals so values line up.
  const colNum = (v) =>
    Math.abs(v) >= 1
      ? v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      : num(v);
  const share = (part, whole) => {
    if (!whole) return "—";
    const pct = (part / whole) * 100;
    // One decimal (2.1%, 99.9%); an earning miner never reads as 0.0%.
    return pct > 0 && pct < 0.05 ? "<0.1%" : `${pct.toFixed(1)}%`;
  };
  // Compact TAO for owner amounts: "1.96k τ", "43.32k τ", "1.20M τ", "0.18 τ".
  const kTao = (v) => {
    if (v == null) return "—";
    const abs = Math.abs(v);
    if (abs >= 1e6) return `${(v / 1e6).toFixed(2)}M τ`;
    if (abs >= 1e3) return `${(v / 1e3).toFixed(2)}k τ`;
    return `${v.toFixed(2)} τ`;
  };
  // Wrap a subnet symbol in direction isolates: RTL symbols (e.g. Hebrew) would otherwise scramble nearby text.
  const sym = (s) => `\u2068${s || ""}\u2069`;
  const kNum = (v) => kTao(v).replace(/ τ$/, ""); // kTao without the unit, for "1.94k / 1.52k τ"
  const shortKey = (key) => `${key.slice(0, 5)}…${key.slice(-4)}`;
  const subnetLabel = (netuid) => {
    const name = subnetInfo.get(netuid)?.name;
    return `SN${netuid}${name ? ` · ${name}` : ""}`;
  };
  const priceRank = (netuid) => subnetInfo.get(netuid)?.price_rank ?? null;
  // The rank the list is sorted by: price (#1 dearest alpha) or emission (#1 largest share).
  const sortRank = (netuid) => sortBy === "price" ? priceRank(netuid)
    : sortBy === "emission" ? subnetInfo.get(netuid)?.emission_rank ?? null : null;
  // By netuid, or by rank. Subnets without that rank (no price, no emission) sort
  // last, by netuid among themselves.
  function compareSubnets(a, b) {
    if (sortBy === "netuid") return a - b;
    const [rankA, rankB] = [sortRank(a), sortRank(b)];
    if (rankA === null && rankB === null) return a - b;
    if (rankA === null) return 1;
    if (rankB === null) return -1;
    return rankA - rankB;
  }

  async function getJSON(url, options) {
    const res = await fetch(url, options);
    const body = await res.json().catch(() => ({}));
    if (res.ok) return body;
    // FastAPI sends a string for our errors and a list of issues for invalid input.
    const detail = Array.isArray(body.detail) ? body.detail.map((d) => d.msg).join("; ") : body.detail;
    throw new Error(detail || `Request failed (${res.status})`);
  }

  // upIsGood: true colors a rise green and a fall red; null keeps it neutral.
  function setDelta(el, stat, upIsGood) {
    el.className = "delta";
    const pct = stat.change_pct;
    if (pct == null) {
      el.textContent = "";
      el.title = "";
      return;
    }
    const shown = pct.toFixed(2);
    const dir = Math.sign(Number(shown)); // a change that rounds to 0.00% is flat
    // Flat changes get no arrow, so only real moves draw the eye.
    el.textContent = `${dir > 0 ? "▲ +" : dir < 0 ? "▼ " : ""}${dir === 0 ? "0.00" : shown}%`;
    el.title = `24h change (24h ago: ${tao(stat.tao_24h_ago)})`;
    if (dir !== 0 && upIsGood !== null) el.classList.add((dir > 0) === upIsGood ? "good" : "bad");
  }

  // How long ago the hotkey registered, from blocks: "7h", "23d", "1.4y".
  function registeredAgo(blocks) {
    const hours = (blocks * 12) / 3600;
    if (hours < 48) return `${Math.round(hours)}h`;
    const days = hours / 24;
    return days < 365 ? `${Math.round(days)}d` : `${(days / 365).toFixed(1)}y`;
  }

  // Immunity time left, e.g. "~20h more (5,924 blocks)".
  function immunityLeft(blocks) {
    const hours = (blocks * 12) / 3600;
    const time = hours < 1 ? "<1h" : hours < 48 ? `~${Math.round(hours)}h` : `~${Math.round(hours / 24)} days`;
    return `${time} more (${blocks.toLocaleString("en-US")} blocks)`;
  }

  // A shortened address that copies the full one when clicked.
  function keyButton(address) {
    const key = document.createElement("button");
    key.type = "button";
    key.className = "hotkey";
    key.textContent = shortKey(address);
    key.title = `${address}\nClick to copy`;
    key.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(address);
        key.textContent = "Copied";
        setTimeout(() => (key.textContent = shortKey(address)), 1200);
      } catch { /* clipboard unavailable; the full key is in the tooltip */ }
    });
    return key;
  }

  // A coldkey shows its saved label (or the short address) and links to the account on
  // Taostats, with a pencil that opens the label editor. paintColdkey keeps every cell
  // for the same address in step after a label changes.
  function paintColdkey(link) {
    const address = link.dataset.coldkey;
    const label = labels.get(address);
    link.textContent = label || shortKey(address);
    link.classList.toggle("labeled", !!label);
    link.title = (label ? `${label}\n${address}` : address) + "\nOpen this account on Taostats";
  }
  function coldkeyCell(address, hotkeys = 1) {
    const wrap = document.createElement("span");
    wrap.className = "ck-cell";
    const key = document.createElement("a");
    key.className = "hotkey ck";
    key.href = `https://taostats.io/account/${encodeURIComponent(address)}`;
    key.target = "_blank";
    key.rel = "noopener noreferrer";
    key.dataset.coldkey = address;
    paintColdkey(key);
    const edit = document.createElement("button");
    edit.type = "button";
    edit.className = "ck-edit";
    edit.textContent = "✎";
    edit.title = labels.has(address) ? "Edit this coldkey's label" : "Label this coldkey";
    edit.setAttribute("aria-label", edit.title);
    edit.addEventListener("click", () => openLabelDialog(address));
    wrap.append(key);
    // How many of this subnet's listed miners run under this coldkey, when more than one.
    if (hotkeys > 1) {
      const count = document.createElement("span");
      count.className = "ck-count";
      count.textContent = `×${hotkeys}`;
      count.title = `${hotkeys} hotkeys from this coldkey on this subnet`;
      wrap.append(count);
    }
    wrap.append(edit);
    return wrap;
  }
  function refreshColdkeyLabels(address) {
    document.querySelectorAll(`.ck[data-coldkey="${CSS.escape(address)}"]`).forEach(paintColdkey);
    document.querySelectorAll(`.ck-cell .ck[data-coldkey="${CSS.escape(address)}"]`).forEach((key) => {
      const edit = key.parentElement.querySelector(".ck-edit");
      if (edit) {
        edit.title = labels.has(address) ? "Edit this coldkey's label" : "Label this coldkey";
        edit.setAttribute("aria-label", edit.title);
      }
    });
  }
  function openLabelDialog(address) {
    const dlg = $("label-dialog");
    dlg.dataset.address = address;
    $("label-address").textContent = address;
    const input = $("label-input");
    input.value = labels.get(address) || "";
    $("label-remove").hidden = !labels.has(address);
    dlg.showModal();
    input.focus();
    input.select();
  }

  function minerRow(miner, fullRecordedTao, fullConsensus, hotkeys) {
    const tr = document.createElement("tr");
    const cell = (content, cls) => {
      const td = document.createElement("td");
      if (cls) td.className = cls;
      td.append(content);
      tr.append(td);
    };

    const immune = miner.immune_blocks_left > 0;
    cell(String(miner.uid), `num uid${immune ? " immune" : ""}`);
    const uid = tr.firstElementChild;
    // Colour alone would leave this out of reach for some readers, so say it in words too.
    uid.title = immune
      ? `Immune miner: can't be deregistered for ${immunityLeft(miner.immune_blocks_left)}`
      : "Not immune: this miner can be deregistered";
    uid.setAttribute("aria-label", `UID ${miner.uid}. ${uid.title}`);

    cell(keyButton(miner.hotkey));
    cell(coldkeyCell(miner.coldkey, hotkeys));
    cell(miner.balance_tao == null ? "—" : kNum(miner.balance_tao), "num");
    tr.lastElementChild.title = miner.balance_tao == null
      ? "The balance read didn't come back in time"
      : `Balance ${kTao(miner.balance_tao)}: free τ${colNum(miner.free_tao)} + staked τ${colNum(miner.staked_tao)}`;
    cell(registeredAgo(miner.age_blocks), "num age");
    tr.lastElementChild.title =
      `Registered ${miner.age_blocks.toLocaleString("en-US")} blocks ago, about ${registeredAgo(miner.age_blocks)}`;
    cell(share(miner.consensus, fullConsensus), "num");
    tr.lastElementChild.title =
      `Incentive ${miner.consensus.toLocaleString("en-US")} of ${fullConsensus.toLocaleString("en-US")} across every miner.\n` +
      `By emission instead — what the chain recorded paying — ${share(miner.recorded_daily_tao, fullRecordedTao)}.`;
    cell(`τ${miner.daily_tao.toFixed(2)}`, "num");
    tr.lastElementChild.title =
      `τ${num(miner.daily_tao)} a day at these weights.\n` +
      `The chain last recorded paying τ${num(miner.recorded_daily_tao)} a day.`;
    return tr;
  }

  function createCard(netuid) {
    const el = $("card-template").content.firstElementChild.cloneNode(true);
    const card = { netuid, el, seq: 0, field: (name) => el.querySelector(`[data-field="${name}"]`) };
    el.dataset.netuid = netuid;
    el.classList.add("pending"); // no data yet: skeleton until the first response
    card.field("title").textContent = subnetLabel(netuid);
    card.field("star").addEventListener("click", () => toggleWatch(netuid));
    card.sort = { key: "daily", dir: "desc" }; // the order the chain's ranking lists them in
    for (const btn of el.querySelectorAll("th .sort")) {
      btn.addEventListener("click", () => {
        const key = btn.dataset.sort;
        card.sort = card.sort.key === key
          ? { key, dir: card.sort.dir === "asc" ? "desc" : "asc" }
          : { key, dir: SORT_FIRST[key] };
        renderMinerRows(card);
        card.field("table").scrollTop = 0;
      });
    }
    // The Reg fee group opens a graph of the registration fee over the last day.
    const feeStat = card.field("fee-stat");
    feeStat.classList.add("tappable");
    feeStat.setAttribute("role", "button");
    feeStat.setAttribute("tabindex", "0");
    feeStat.setAttribute("aria-label", "Show the registration fee over the last 24 hours");
    feeStat.addEventListener("click", () => openBurnChart(card.netuid));
    feeStat.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openBurnChart(card.netuid); }
    });
    enableReorder(card);
    return card;
  }

  // Watched cards move by dragging their handle (mouse or touch), or with arrow keys on it.
  function enableReorder(card) {
    const handle = card.field("handle");
    handle.addEventListener("pointerdown", (e) => {
      if (!watch.includes(card.netuid) || e.button !== 0) return;
      e.preventDefault();
      card.el.classList.add("dragging");
      document.body.classList.add("reordering");

      const onMove = (ev) => {
        if (ev.clientY < 60) scrollBy(0, -12);
        else if (ev.clientY > innerHeight - 60) scrollBy(0, 12);
        const target = document.elementFromPoint(ev.clientX, ev.clientY)?.closest(".card");
        if (!target || target === card.el || target.classList.contains("preview")) return;
        const els = [...grid.children];
        if (els.indexOf(card.el) < els.indexOf(target)) target.after(card.el);
        else target.before(card.el);
      };
      const onEnd = () => {
        removeEventListener("pointermove", onMove);
        removeEventListener("pointerup", onEnd);
        removeEventListener("pointercancel", onEnd);
        card.el.classList.remove("dragging");
        document.body.classList.remove("reordering");
        watch = [...grid.children].map((el) => Number(el.dataset.netuid)).filter((n) => watch.includes(n));
        saveWatch();
      };
      // Listen on the window, not the handle: moving the card in the DOM mid-drag
      // drops pointer capture, and the release would never reach the handle.
      addEventListener("pointermove", onMove);
      addEventListener("pointerup", onEnd);
      addEventListener("pointercancel", onEnd);
    });
    handle.addEventListener("keydown", (e) => {
      const step = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 }[e.key];
      const from = watch.indexOf(card.netuid);
      const to = from + (step ?? 0);
      if (!step || from < 0 || to < 0 || to >= watch.length) return;
      e.preventDefault();
      [watch[from], watch[to]] = [watch[to], watch[from]];
      saveWatch();
      layout();
      handle.focus();
    });
  }

  // A header's first click: names A→Z, low UIDs first; every figure largest first.
  const SORT_FIRST = { uid: "asc", hotkey: "asc", coldkey: "desc", balance: "desc", age: "desc", incentive: "desc", daily: "desc" };

  // The card's miner rows in its chosen order. Coldkey sorts by how many hotkeys the
  // coldkey runs here, keeping each coldkey's together; ties fall back to the default
  // order (daily TAO, then UID), and a missing figure (a balance that didn't load) sorts last.
  function renderMinerRows(card) {
    const d = card.data;
    if (!d) return;
    const hotkeysOf = new Map(); // coldkey -> how many listed miners it runs here
    for (const m of d.top_miners) hotkeysOf.set(m.coldkey, (hotkeysOf.get(m.coldkey) || 0) + 1);
    const { key, dir } = card.sort;
    const value = {
      uid: (m) => m.uid, hotkey: (m) => m.hotkey, coldkey: (m) => hotkeysOf.get(m.coldkey),
      balance: (m) => m.balance_tao, age: (m) => m.age_blocks, incentive: (m) => m.consensus, daily: (m) => m.daily_tao,
    }[key];
    const sign = dir === "asc" ? 1 : -1;
    const miners = [...d.top_miners].sort((a, b) => {
      const va = value(a), vb = value(b);
      if ((va == null) !== (vb == null)) return va == null ? 1 : -1;
      if (va != null && va !== vb) return (typeof va === "string" ? va.localeCompare(vb) : va - vb) * sign;
      if (key === "coldkey" && a.coldkey !== b.coldkey) return a.coldkey < b.coldkey ? -1 : 1;
      return b.daily_tao - a.daily_tao || a.uid - b.uid;
    });
    const fullConsensus = d.miner_burn.full_consensus;
    const rows = miners.map((m) =>
      minerRow(m, d.miner_burn.full_recorded_daily_tao, fullConsensus, hotkeysOf.get(m.coldkey)));
    // Every card is MINER_ROWS tall. A subnet with fewer active miners pads out with
    // empty rows — each a full set of cells, so the columns and row-lines carry on —
    // instead of leaving a blank gap above the totals; more miners scroll (max-height).
    for (let i = rows.length; i < MINER_ROWS; i++) {
      const tr = document.createElement("tr");
      tr.className = "pad";
      tr.setAttribute("aria-hidden", "true");
      for (let c = 0; c < MINER_COLS; c++) {
        const td = document.createElement("td");
        td.textContent = "\u00A0"; // a non-breaking space gives the row a data row's height
        tr.appendChild(td);
      }
      rows.push(tr);
    }
    card.field("miners").replaceChildren(...rows);
    for (const btn of card.el.querySelectorAll("th .sort")) {
      const th = btn.closest("th");
      if (btn.dataset.sort === key) th.setAttribute("aria-sort", dir === "asc" ? "ascending" : "descending");
      else th.removeAttribute("aria-sort");
    }
  }

  // "45s", "29m", "1h 4m": a stretch of seconds, rounded for a glance.
  const roughly = (secs) => secs < 60 ? `${Math.max(1, Math.round(secs))}s`
    : secs < 3600 ? `${Math.round(secs / 60)}m` : `${Math.floor(secs / 3600)}h ${Math.round((secs % 3600) / 60)}m`;

  // The epoch row, from the last data plus the 12 s blocks since it arrived; past the
  // next epoch it carries on into the one after, until the next refresh catches up.
  function paintEpoch(card) {
    const e = card.epoch, row = card.field("epoch");
    if (!e || !e.tempo) { row.hidden = true; return; }
    const since = (e.blocks_since + (Date.now() - e.at) / 12_000) % e.tempo;
    card.field("epoch-fill").style.width = `${(since / e.tempo) * 100}%`;
    row.title = `Epoch: ${Math.floor(since)} / ${e.tempo} blocks, next in ${roughly((e.tempo - since) * 12)}.\n` +
      `An epoch runs every ${e.tempo} blocks (about ${roughly(e.tempo * 12)}); the last was at block ` +
      `${e.last_step.toLocaleString("en-US")}.`;
    row.hidden = false;
  }

  function renderCard(card, d) {
    const f = card.field;
    card.el.classList.remove("pending");
    f("skeleton").hidden = true;
    f("body").hidden = false;
    f("title").textContent = `SN${d.netuid} · ${d.name || "Unnamed"} ${sym(d.symbol)}`;
    const subnetImmune = f("subnet-immune");
    subnetImmune.hidden = !(d.immune_blocks_left > 0);
    subnetImmune.title = `Immune subnet: can't be deregistered for ${immunityLeft(d.immune_blocks_left)}`;
    subnetImmune.setAttribute("aria-label", subnetImmune.title);

    // Logo, falling back to the token symbol when there is none or it fails to load.
    const logo = f("logo");
    const img = f("logo-img");
    const showLogo = (loaded) => {
      img.hidden = !loaded;
      f("logo-fallback").hidden = loaded;
      logo.classList.toggle("has-img", loaded);
    };
    f("logo-fallback").textContent = d.symbol || "";
    if (!d.logo_url) {
      img.removeAttribute("src");
      showLogo(false);
    } else if (img.getAttribute("src") !== d.logo_url) {
      showLogo(false);
      img.onload = () => showLogo(true);
      img.onerror = () => showLogo(false);
      img.src = d.logo_url;
    }

    for (const [field, label] of [["website", "Website"], ["github", "GitHub"]]) {
      const link = f(field);
      const url = d.links[field];
      link.hidden = !url;
      if (url) {
        link.href = url;
        link.title = `${label}: ${url}`;
      } else {
        link.removeAttribute("href");
      }
    }

    f("price").textContent = tao(d.alpha_price.tao);
    setDelta(f("price-delta"), d.alpha_price, true);
    showListStats(card);
    const regfee = d.registration_fee;
    f("fee").textContent = tao(regfee.tao);
    // The registration burn range, not a 24h change: min to max burn cost.
    const feeDelta = f("fee-delta");
    feeDelta.className = "delta"; // plain, no up/down colour
    feeDelta.textContent =
      regfee.min_tao == null || regfee.max_tao == null ? "" : `${tao(regfee.min_tao)}–${tao(regfee.max_tao)}`;
    f("fee-stat").title = regfee.min_tao == null
      ? ""
      : `Registration burn: currently ${tao(regfee.tao)}, adjusts with demand ` +
        `between ${tao(regfee.min_tao)} (min) and ${tao(regfee.max_tao)} (max).`;

    // Subnet pool: the AMM reserves, in k/M units. TAO depth as the value, alpha beneath.
    f("pool").textContent = `${kNum(d.pool.tao)} τ`;
    f("pool-alpha").textContent = `${kNum(d.pool.alpha)} ${sym(d.symbol)}`;
    f("pool-stat").title =
      `Liquidity pool: ${num(d.pool.tao)} τ and ${num(d.pool.alpha)} ${sym(d.symbol)}.\n` +
      `Their ratio is the alpha price (τ${num(d.alpha_price.tao)}).`;

    const emitting = d.alpha_emission_per_block > 0;
    const pct = emitting ? d.miner_burn.pct : null;
    f("burn").textContent = pct == null ? "—" : `${pct.toFixed(1)}%`;
    f("burn-full").textContent = pct == null ? "" : `(${tao(d.miner_burn.full_daily_tao)})`;
    f("burn-stat").title = emitting
      ? `Share of last epoch's miner emission ${d.miner_burn.mode === "recycle" ? "recycled" : "burned"} via owner hotkeys.\n` +
        `In brackets: all miner emission per day if nothing were burned ` +
        `(${colNum(d.miner_burn.full_daily_alpha)} ${sym(d.symbol)} = ${tao(d.miner_burn.full_daily_tao)}).`
      : "This subnet isn't receiving any emission right now";

    // Owner chip: total balance / locked stake, both in TAO; details on hover, Taostats on click.
    const owner = d.owner;
    f("owner").hidden = !owner;
    if (owner) {
      const chip = f("owner");
      chip.href = `https://taostats.io/account/${encodeURIComponent(owner.coldkey)}`;
      f("owner-balance").textContent = kNum(owner.balance_tao);
      f("owner-locked").textContent =
        owner.locked_alpha == null ? "—" : owner.locked_alpha === 0 ? "0" : kNum(owner.locked_tao);
      const balanceLine = owner.balance_tao == null ? "Balance unavailable"
        : `Balance ${kTao(owner.balance_tao)}: free τ${colNum(owner.free_tao)} + staked τ${colNum(owner.staked_tao)} (root τ${colNum(owner.root_staked_tao)})`;
      const lockLine = owner.locked_alpha == null ? "Lock unavailable"
        : owner.locked_alpha === 0 ? "Lock: nothing locked on this subnet"
        : `Lock ${num(owner.locked_alpha)} ${sym(d.symbol)} = ${kTao(owner.locked_tao)}` +
          (owner.stake_alpha ? ` (${Math.round((owner.locked_alpha / owner.stake_alpha) * 100)}% of the owner's stake here)` : "");
      chip.title = `Subnet owner: total balance / locked stake\n${balanceLine}\n${lockLine}\nClick to open the owner on Taostats`;
      chip.setAttribute("aria-label",
        `Owner balance ${f("owner-balance").textContent} τ, locked ${f("owner-locked").textContent} τ. Opens Taostats`);
    }

    // Shares are of all miner emission, burned part included, so shares + Burn % ≈ 100%.
    const fullDailyAlpha = d.miner_burn.full_daily_alpha;
    const fullConsensus = d.miner_burn.full_consensus; // every miner, as the share's whole
    card.data = d;
    renderMinerRows(card);
    card.epoch = d.epoch ? { ...d.epoch, at: Date.now() } : null;
    paintEpoch(card);
    const totals = d.miner_totals;
    // The list now holds every active miner, so the totals are simply the whole:
    // the miners' share of all emission (the whole counts burned emission too), and
    // their combined daily TAO.
    f("total-share").replaceChildren(share(totals.consensus, fullConsensus));
    f("total-tao").textContent = `τ${totals.daily_tao.toFixed(2)}`;

    // "30 miners": the count of active miners, all of them listed above.
    const labelText = document.createElement("span");
    labelText.className = "tl-text";
    labelText.textContent = `${totals.count} miner${totals.count === 1 ? "" : "s"}`;

    // The subnet's live emission split, read from the chain: a segmented bar
    // (owner / vali-root / vali-alpha / miner) between the label and the share
    // column, with each label aligned beneath its segment's part of the bar.
    const es = d.emission_split;
    const main = document.createElement("div");
    main.className = "total-main";
    main.appendChild(labelText);
    if (es) {
      // A round figure keeps no decimals; an odd share shows two (10% but 5.73%).
      const pctOf = (x) => {
        const v = Math.round(x * 10000) / 100;
        return (Number.isInteger(v) ? v : v.toFixed(2)) + "%";
      };
      const parts = [
        ["owner", "Owner", es.owner],
        ["vroot", "Vali/Root", es.vali_root],
        ["valpha", "Vali/Alpha", es.vali_alpha],
        ["miner", "Miner", es.miner],
      ];
      const esplit = document.createElement("div");
      esplit.className = "esplit";
      esplit.title = "How this subnet's alpha emission is shared out, read live from the chain. Miners earn their Daily TAO from their slice";
      const bar = document.createElement("div");
      bar.className = "esplit-bar";
      const legend = document.createElement("div");
      legend.className = "esplit-legend";
      for (const [cls, name, frac] of parts) {
        const seg = document.createElement("span");
        seg.className = `seg seg-${cls}`;
        seg.style.flex = String(frac);
        seg.title = `${name} ${pctOf(frac)}`;
        bar.appendChild(seg);
        const li = document.createElement("div");
        li.className = "li";
        const nm = document.createElement("span");
        nm.className = "name";
        const dot = document.createElement("i");
        dot.className = `seg-${cls}`;
        nm.append(dot, name);
        const pct = document.createElement("span");
        pct.className = "pct";
        pct.textContent = pctOf(frac);
        li.append(nm, pct);
        legend.appendChild(li);
      }
      esplit.append(bar, legend);
      main.appendChild(esplit);
    }
    f("total-label").replaceChildren(main);

    const hasMiners = d.top_miners.length > 0;
    f("table").hidden = !hasMiners;
    f("empty").hidden = hasMiners;
    f("empty").title = emitting
      ? "No miners earned emission last epoch, apart from the owner's own hotkeys"
      : "This subnet isn't receiving any emission right now";

    fitStats(card);
  }

  // Figures that come from the subnet list rather than the card's own request:
  // where its price ranks, and its share of the TAO the chain emits to subnets.
  function showListStats(card) {
    const info = subnetInfo.get(card.netuid);
    const rank = info?.price_rank ?? null;
    const rankEl = card.field("price-rank");
    rankEl.hidden = rank === null;
    if (rank !== null) {
      rankEl.textContent = `#${rank}`;
      rankEl.title = `Price rank ${rank} of ${rankedCount} subnets (#1 has the dearest alpha)`;
    }

    const eRank = info?.emission_rank ?? null;
    const eRankEl = card.field("emission-rank");
    eRankEl.hidden = eRank === null;
    if (eRank !== null) {
      eRankEl.textContent = `#${eRank}`;
      eRankEl.title = `Emission rank ${eRank} of ${emittingCount} subnets (#1 gets the largest share)`;
    }

    const pct = info?.emission_pct ?? null;
    // Green while the subnet receives any emission; a share too small for two decimals
    // reads "<0.01%" rather than a green "0.00%".
    const emitting = pct !== null && pct > 0;
    const emission = card.field("emission");
    emission.textContent = pct === null ? "—" : emitting && pct < 0.005 ? "<0.01%" : `${pct.toFixed(2)}%`;
    emission.classList.toggle("good", emitting);
    card.field("emission-day").textContent = pct === null ? "" : `(${tao(info.emission_tao_per_day)}/d)`;
    card.field("emission-stat").title = pct === null
      ? "The chain isn't emitting to this subnet right now"
      : `Share of the TAO the chain emits to subnets: ${pct.toFixed(2)}%\n` +
        `In brackets: what that comes to per day (${tao(info.emission_tao_per_day)}).`;
  }

  // Shrink a stat value that doesn't fit its group (e.g. τ0.0005623 on a narrow phone).
  function fitStats(card) {
    for (const value of card.el.querySelectorAll(".body .stat-value")) {
      value.classList.remove("tight");
      const stat = value.closest(".stat");
      if (stat.scrollWidth > stat.clientWidth + 1) value.classList.add("tight");
    }
  }
  let fitQueued = false;
  addEventListener("resize", () => {
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(() => {
      fitQueued = false;
      cards.forEach(fitStats);
      fillLastRow();
    });
  });

  // The 7-day price sparkline behind the table. Fetched once per card (its own
  // long server cache), then drawn as a faint background; failure just hides it.
  async function loadSpark(card) {
    if (card.sparkDone) return;
    card.sparkDone = true;
    let history;
    try {
      history = (await getJSON(`/api/subnets/${card.netuid}/price-7d`)).history_7d;
    } catch {
      return; // the table reads fine without it
    }
    const svg = card.field("spark");
    // On an SVG element, setting .hidden doesn't remove the attribute [hidden]
    // matches, so toggle the attribute directly.
    if (!history || history.length < 2) {
      svg.setAttribute("hidden", "");
      return;
    }
    const lo = Math.min(...history), hi = Math.max(...history);
    const mid = (hi + lo) / 2;
    // Floor the vertical scale at ±3% of the mid price, so a near-flat line
    // (a subnet with little or no price movement) reads as flat instead of
    // having its noise stretched to fill the table.
    const half = Math.max((hi - lo) / 2, mid * 0.03) * 1.15; // 15% headroom
    const x = (i) => (i / (history.length - 1)) * 100;
    const y = (v) => 50 - ((v - mid) / (half || 1)) * 48;
    const pts = history.map((v, i) => [x(i), y(v)]);
    // A Catmull-Rom spline through the points, as cubic Béziers, so the line
    // reads as a smooth curve rather than straight segments between samples.
    let line = `M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      line += `C${c1x.toFixed(2)},${c1y.toFixed(2)} ${c2x.toFixed(2)},${c2y.toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
    }
    card.field("spark-line").setAttribute("d", line);
    card.field("spark-area").setAttribute("d", `M0,100L0,${pts[0][1].toFixed(2)}${line.slice(1)}L100,100Z`);
    svg.classList.toggle("up", history[history.length - 1] >= history[0]);
    svg.classList.toggle("down", history[history.length - 1] < history[0]);
    svg.removeAttribute("hidden");
  }

  // The registration-fee (burn) graph over the last day, opened from the Reg fee group.
  let burnReq = 0, burnData = null, regData = null;
  function openBurnChart(netuid) {
    const dlg = $("burn-dialog");
    $("burn-sub").textContent = subnetLabel(netuid);
    const chart = $("burn-chart");
    chart.innerHTML = '<p class="burn-msg">Loading…</p>';
    burnData = regData = null; // a resize mid-load must not redraw the previous subnet's graphs
    $("reg-bars").innerHTML = '<p class="burn-msg">Loading registrations…</p>';
    $("reg-total").textContent = "";
    $("reg-chips").replaceChildren();
    dlg.showModal();
    const req = ++burnReq;
    // The month's snapshots arrive in the background; poll until they're all in.
    const loadRegs = () => getJSON(`/api/subnets/${netuid}/registrations-30d`).then((r) => {
      if (req !== burnReq || !dlg.open) return;
      regData = r;
      renderRegBars($("reg-bars"), r);
      if (r.partial) setTimeout(loadRegs, 6000);
    }).catch(() => {
      if (req === burnReq) $("reg-bars").innerHTML = '<p class="burn-msg">Couldn’t load the registrations.</p>';
    });
    loadRegs();
    getJSON(`/api/subnets/${netuid}/burn-1d`).then((d) => {
      if (req !== burnReq) return; // a newer open (or a close) supersedes this one
      if (!d.burn || d.burn.length < 2) {
        chart.innerHTML = '<p class="burn-msg">Not enough burn history to graph.</p>';
        return;
      }
      if (!d.exact) $("burn-sub").textContent += " · approximate";
      burnData = d;
      renderBurnChart(chart, d);
      renderRegChips(d);
    }).catch(() => {
      if (req === burnReq) chart.innerHTML = '<p class="burn-msg">Couldn’t load the burn history.</p>';
    });
  }
  const burnTau = (v, digits) => "τ" + parseFloat(v.toPrecision(digits));
  const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
  // A round tick step (1, 2, 2.5 or 5 x 10^k) at least as large as raw.
  function niceStep(raw) {
    const mag = 10 ** Math.floor(Math.log10(raw || 1e-9));
    return [1, 2, 2.5, 5, 10].map((f) => f * mag).find((v) => v >= raw);
  }
  // The day's burn at every block (rao, d.burn[i] for block start_block + i), as a
  // straight-segment line like TaoMarketCap's, with the min-burn floor dashed, the
  // live value boxed on the right axis, and an exact per-block hover readout.
  function renderBurnChart(container, d) {
    // Drawn 1:1 at the dialog's width (text stays its true size; a wider plot gives
    // fewer blocks per pixel), about 0.42 as tall, kept on screen.
    const W = Math.max(320, Math.round(container.clientWidth));
    const H = Math.round(Math.max(220, Math.min(400, W * 0.34, innerHeight - 560)));
    const L = 8, R = 70, T = 12, B = 28, base = H - B, plotW = W - L - R;
    const vals = d.burn.map((r) => r / 1e9), n = vals.length, last = vals[n - 1];
    // Scale to the day's own range, as TaoMarketCap does: the floor (the fee never drops
    // below MinBurn) sits padB above the bottom and the peak padT below the top, so a
    // subnet idling at a high floor (SN24 at τ0.1) still fills the height with its spikes.
    const lo = Math.min(d.min_tao, ...vals);
    let hi = Math.max(...vals);
    if (hi - lo <= lo * 1e-6) hi = lo * 1.05 || 1e-9;                // flat all day: some headroom
    const padT = 10, padB = 22, floorY = base - padB, peakY = T + padT;
    const x = (i) => L + (i / (n - 1)) * plotW;
    const y = (v) => floorY - ((v - lo) / (hi - lo)) * (floorY - peakY);
    const valueAt = (py) => lo + ((floorY - py) / (floorY - peakY)) * (hi - lo);
    const step = niceStep((valueAt(T) - valueAt(base)) / 6);
    const timeOf = (i) => d.start_ms + (i / (n - 1)) * (d.end_ms - d.start_ms);

    // Thousands of blocks over a few hundred pixels: keep each pixel column's first,
    // lowest, highest and last point, in order — the drawn line is pixel-identical.
    const keep = [];
    for (let i = 0, col = -1, lo, hi, first; i < n; i++) {
      const c = Math.floor(x(i));
      if (c !== col) {
        if (col >= 0) keep.push(first, lo, hi, i - 1);
        col = c; first = lo = hi = i;
      }
      if (vals[i] < vals[lo]) lo = i;
      if (vals[i] > vals[hi]) hi = i;
      if (i === n - 1) keep.push(first, lo, hi, i);
    }
    const idx = [...new Set(keep)].sort((a, b) => a - b);
    const line = idx.map((i, k) => `${k ? "L" : "M"}${x(i).toFixed(1)},${y(vals[i]).toFixed(1)}`).join("");

    let grid = "", yLabels = "";
    for (let k = Math.floor(lo / step) + 1; k * step <= valueAt(T); k++) {  // ticks above the floor
      const v = k * step, yy = y(v).toFixed(1);
      grid += `<line class="burn-grid" x1="${L}" y1="${yy}" x2="${W - R}" y2="${yy}"/>`;
      yLabels += `<text class="burn-axis" x="${W - R + 6}" y="${(y(v) + 3).toFixed(1)}">${burnTau(v, 4)}</text>`;
    }
    // Clock labels on round hours, every 3 h across the day.
    let xLabels = "";
    const hourMs = 3600e3, spanMs = d.end_ms - d.start_ms;
    const stepMs = [1, 1.5, 2, 3, 4, 6].map((h) => h * hourMs).find((ms) => (ms / spanMs) * plotW >= 64) || 6 * hourMs;
    for (let t = Math.ceil(d.start_ms / stepMs) * stepMs; t < d.end_ms; t += stepMs) {
      const i = ((t - d.start_ms) / (d.end_ms - d.start_ms)) * (n - 1), xx = x(i);
      if (xx < L + 14 || xx > W - R - 14) continue;
      xLabels += `<text class="burn-axis" x="${xx.toFixed(1)}" y="${H - 8}" text-anchor="middle">${clock(t)}</text>`;
    }
    const yMin = y(d.min_tao);
    const nowY = Math.min(base - 9, Math.max(T + 9, y(last)));

    container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Registration fee at every block over the last 24 hours">
      ${grid}
      <line class="burn-grid" x1="${L}" y1="${base}" x2="${W - R}" y2="${base}"/>
      <line class="burn-min" x1="${L}" y1="${yMin.toFixed(1)}" x2="${W - R}" y2="${yMin.toFixed(1)}"/>
      <text class="burn-min-label" x="${L + 4}" y="${(yMin + 13).toFixed(1)}">Min burn ${burnTau(d.min_tao, 4)}</text>
      <path class="burn-line" d="${line}"/>
      ${yLabels}${xLabels}
      <g class="burn-now">
        <rect x="${W - R + 2}" y="${(nowY - 9).toFixed(1)}" width="${R - 4}" height="18" rx="3"/>
        <text x="${W - R / 2}" y="${(nowY + 3.5).toFixed(1)}" text-anchor="middle">${burnTau(last, 4)}</text>
      </g>
      <g class="burn-cursor" style="display:none">
        <line class="burn-crosshair" x1="0" x2="0" y1="${T}" y2="${base}"/>
        <circle class="burn-dot burn-cdot" r="3.5"/>
      </g>
      <g class="burn-tip" style="display:none">
        <rect rx="4" width="150" height="34"/>
        <text class="burn-tip-fee" x="8" y="15"></text>
        <text class="burn-tip-time" x="8" y="28"></text>
      </g>
      <rect class="burn-hit" x="${L}" y="${T}" width="${plotW}" height="${base - T}"/>
    </svg>`;

    const svg = container.querySelector("svg");
    const cursor = svg.querySelector(".burn-cursor"), cLine = svg.querySelector(".burn-crosshair");
    const cDot = svg.querySelector(".burn-cdot"), tip = svg.querySelector(".burn-tip");
    const tipFee = svg.querySelector(".burn-tip-fee"), tipTime = svg.querySelector(".burn-tip-time");
    const regs = new Set(d.registrations || []);
    const hit = svg.querySelector(".burn-hit");
    const move = (clientX, clientY) => {
      const rect = svg.getBoundingClientRect();
      const ux = W / rect.width;                                     // viewBox units per screen pixel
      const sx = (clientX - rect.left) * ux, sy = (clientY - rect.top) * (H / rect.height);
      // A screen pixel spans ~a dozen blocks, and a registration can jump the fee inside
      // one. Of the blocks under the pointer, take the one plotted nearest it vertically:
      // the top of a spike reads the spike, its foot reads the foot.
      const at = ((sx - L) / plotW) * (n - 1), span = Math.max(1, (ux / plotW) * (n - 1));
      let i = Math.max(0, Math.min(n - 1, Math.round(at)));
      for (let k = Math.max(0, Math.floor(at - span)); k <= Math.min(n - 1, Math.ceil(at + span)); k++) {
        if (Math.abs(y(vals[k]) - sy) < Math.abs(y(vals[i]) - sy)) i = k;
      }
      const cx = x(i), cy = y(vals[i]), block = d.start_block + i;
      cLine.setAttribute("x1", cx.toFixed(1)); cLine.setAttribute("x2", cx.toFixed(1));
      cDot.setAttribute("cx", cx.toFixed(1)); cDot.setAttribute("cy", cy.toFixed(1));
      cursor.style.display = "";
      tipFee.textContent = burnTau(vals[i], 6) + (regs.has(block) ? "  ▲ registration" : "");
      tipTime.textContent = `${clock(timeOf(i))} · block ${block.toLocaleString("en-US")}`;
      let tx = cx + 10, ty = cy - 42;                                  // above-right, kept in bounds
      if (tx + 150 > W - R) tx = cx - 160;
      if (ty < T) ty = cy + 8;
      tip.setAttribute("transform", `translate(${tx.toFixed(1)},${ty.toFixed(1)})`);
      tip.style.display = "";
    };
    hit.addEventListener("mousemove", (e) => move(e.clientX, e.clientY));
    hit.addEventListener("mouseleave", () => { cursor.style.display = "none"; tip.style.display = "none"; });
    hit.addEventListener("touchstart", (e) => { if (e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    hit.addEventListener("touchmove", (e) => { if (e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  }

  // The registration facts, as chips under the bars (TaoMarketCap's header row, here).
  function renderRegChips(d) {
    const atMin = d.burn_now_tao <= d.min_tao;
    const perHour = 1 - 0.5 ** (300 / d.half_life); // 300 blocks an hour
    // Two groups, one row each: what a registration costs, then how fast it moves.
    const chips = [
      ["Current cost", burnTau(d.burn_now_tao, 4)],
      ["Burn range", `${burnTau(d.min_tao, 4)} – ${burnTau(d.max_tao, 4)}`],
      ["Cost multiplier", `+${parseFloat(((d.mult - 1) * 100).toFixed(2))}%`],
      ["Total recycled", d.total_recycled_tao == null ? "—"
        : "τ" + d.total_recycled_tao.toLocaleString("en-US", { maximumFractionDigits: 2 })],
      ["Registrations 24h", d.registrations_24h.toLocaleString("en-US")],
      ["Burn decay", atMin ? "Minimum reached" : `−${(perHour * 100).toFixed(1)}% / h`, atMin ? "good" : ""],
      ["Decay half-life", `${d.half_life.toLocaleString("en-US")} blocks`],
      ["Immunity period", `${d.immunity_period.toLocaleString("en-US")} blocks`],
    ];
    $("reg-chips").replaceChildren(...chips.map(([k, v, cls]) => {
      const chip = document.createElement("div");
      chip.className = cls ? `reg-chip ${cls}` : "reg-chip";
      const key = document.createElement("span"), val = document.createElement("b");
      key.textContent = k; val.textContent = v;
      chip.append(key, val);
      return chip;
    }));
  }
  // Neurons registered per UTC day over the month, as bars (today, still filling, is faded).
  function renderRegBars(container, r) {
    const W = Math.max(320, Math.round(container.clientWidth)), H = 150, L = 8, R = 70, T = 10, B = 22;
    const base = H - B, plotW = W - L - R, days = r.days, n = days.length;
    const max = Math.max(1, ...days.map((x) => x.count || 0)), step = niceStep(max / 3), top = Math.ceil(max / step) * step;
    const y = (v) => base - (v / top) * (base - T);
    const slot = plotW / n, bw = Math.max(2, slot * 0.68);
    const dayLabel = (iso, opts) => new Date(`${iso}T00:00:00Z`).toLocaleDateString([], { timeZone: "UTC", ...opts });
    let grid = "", labels = "", bars = "";
    for (let k = 1; k * step <= top; k++) {
      const yy = y(k * step).toFixed(1);
      grid += `<line class="burn-grid" x1="${L}" y1="${yy}" x2="${W - R}" y2="${yy}"/>`;
      labels += `<text class="burn-axis" x="${W - R + 6}" y="${(+yy + 3.5).toFixed(1)}">${(k * step).toLocaleString("en-US")}</text>`;
    }
    days.forEach((dd, i) => {
      const x = L + i * slot + (slot - bw) / 2, top_ = y(dd.count || 0);
      if (dd.count != null) bars += `<rect class="reg-bar${i === n - 1 ? " today" : ""}" data-i="${i}" x="${x.toFixed(1)}" y="${top_.toFixed(1)}" width="${bw.toFixed(1)}" height="${(base - top_).toFixed(1)}" rx="1"/>`;
      if (i % 5 === 4 || i === n - 1) {
        labels += `<text class="burn-axis" x="${(L + i * slot + slot / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${dayLabel(dd.date, { month: "short", day: "numeric" })}</text>`;
      }
    });
    container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Registrations per day over the last 30 days">
      ${grid}<line class="burn-grid" x1="${L}" y1="${base}" x2="${W - R}" y2="${base}"/>${bars}${labels}
      <g class="burn-tip" style="display:none"><rect rx="4" width="150" height="34"/>
        <text class="burn-tip-fee" x="8" y="15"></text><text class="burn-tip-time" x="8" y="28"></text></g>
      <rect class="burn-hit" x="${L}" y="${T}" width="${plotW}" height="${base - T}"/>
    </svg>`;
    $("reg-total").innerHTML = "";
    const total = document.createElement("b");
    total.textContent = r.total.toLocaleString("en-US");
    if (r.partial) {
      const [got, need] = r.progress;
      $("reg-total").append(`Loading older days ${Math.round((got / need) * 100)}% · so far `, total);
    } else {
      $("reg-total").append(r.complete ? "Total " : "At least ", total);
    }

    const svg = container.querySelector("svg"), tip = svg.querySelector(".burn-tip");
    const tipFee = svg.querySelector(".burn-tip-fee"), tipTime = svg.querySelector(".burn-tip-time");
    const hit = svg.querySelector(".burn-hit");
    let on = -1;
    const move = (clientX) => {
      const rect = svg.getBoundingClientRect(), sx = (clientX - rect.left) * (W / rect.width);
      const i = Math.max(0, Math.min(n - 1, Math.floor((sx - L) / slot)));
      if (on >= 0) svg.querySelector(`.reg-bar[data-i="${on}"]`)?.classList.remove("on");
      const dd = days[i], cx = L + i * slot + slot / 2;
      const bar = svg.querySelector(`.reg-bar[data-i="${i}"]`);
      if (bar) { bar.classList.add("on"); on = i; }
      tipFee.textContent = dd.count == null ? "Loading…"
        : `${dd.count.toLocaleString("en-US")} registration${dd.count === 1 ? "" : "s"}`;
      tipTime.textContent = dayLabel(dd.date, { weekday: "short", month: "short", day: "numeric" }) + (i === n - 1 ? " · so far" : "");
      let tx = cx + 10;
      if (tx + 150 > W - R) tx = cx - 160;
      tip.setAttribute("transform", `translate(${tx.toFixed(1)},${T + 2})`);
      tip.style.display = "";
    };
    hit.addEventListener("mousemove", (e) => move(e.clientX));
    hit.addEventListener("mouseleave", () => {
      tip.style.display = "none";
      if (on >= 0) svg.querySelector(`.reg-bar[data-i="${on}"]`)?.classList.remove("on");
      on = -1;
    });
    hit.addEventListener("touchstart", (e) => { if (e.touches[0]) move(e.touches[0].clientX); }, { passive: true });
    hit.addEventListener("touchmove", (e) => { if (e.touches[0]) move(e.touches[0].clientX); }, { passive: true });
  }

  async function load(card) {
    const seq = ++card.seq;
    card.el.classList.add("loading");
    try {
      const data = await getJSON(`/api/subnets/${card.netuid}`);
      if (seq !== card.seq) return;
      renderCard(card, data);
      card.field("error").hidden = true;
      loadSpark(card);
    } catch (e) {
      if (seq !== card.seq) return;
      card.field("skeleton").hidden = true;
      card.el.classList.remove("pending");
      card.field("error").textContent = e.message;
      card.field("error").hidden = false;
    } finally {
      if (seq === card.seq) card.el.classList.remove("loading");
    }
  }

  function setStar(card, watched) {
    const star = card.field("star");
    star.textContent = watched ? "★" : "☆ Watch";
    star.title = watched ? "Remove from watch list" : "Add to watch list";
    star.setAttribute("aria-label", star.title);
    star.setAttribute("aria-pressed", String(watched));
    card.el.classList.toggle("preview", !watched);
  }

  // Cards shown: the selected subnet first when it isn't watched, then the watch list.
  function layout() {
    const order = selected && !watch.includes(selected) ? [selected, ...watch] : [...watch];
    for (const [netuid, card] of cards) {
      if (!order.includes(netuid)) {
        card.el.remove();
        cards.delete(netuid);
      }
    }
    for (const netuid of order) {
      let card = cards.get(netuid);
      if (!card) {
        card = createCard(netuid);
        cards.set(netuid, card);
        load(card);
      }
      setStar(card, watch.includes(netuid));
      grid.append(card.el);
    }
    $("hint").hidden = order.length > 0;
    fillLastRow();
    updatePicker();
  }

  // Blank cards after the last one, up to the end of its row (decoration only). The
  // grid has as many columns as fit, so this reruns on resize.
  function fillLastRow() {
    grid.querySelectorAll(".card-filler").forEach((el) => el.remove());
    const count = grid.querySelectorAll(".card").length;
    const cols = getComputedStyle(grid).gridTemplateColumns.split(" ").length;
    const missing = count && cols > 1 ? (cols - (count % cols)) % cols : 0;
    for (let i = 0; i < missing; i++) {
      const blank = document.createElement("div");
      blank.className = "card-filler";
      blank.setAttribute("aria-hidden", "true");
      blank.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 2.5h5L16 13h5"/>
        <path d="M5.5 5h13L21 13v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5z"/></svg>Empty`;
      grid.append(blank);
    }
  }

  function toggleWatch(netuid) {
    watch = watch.includes(netuid) ? watch.filter((n) => n !== netuid) : [netuid, ...watch];
    saveWatch();
    layout();
  }

  let pickerShows = ""; // what the picker already lists, so it isn't rebuilt under the mouse
  function updatePicker() {
    const ids = new Set([...subnetInfo.keys(), ...watch]);
    if (selected) ids.add(selected);
    const labels = [...ids].sort(compareSubnets).map((n) => {
      const rank = sortRank(n);
      const rankTag = rank !== null ? `#${rank} · ` : "";
      return [n, `${watch.includes(n) ? "★ " : ""}${rankTag}${subnetLabel(n)}`];
    });
    const shows = `${selected}|${labels.map(([n, label]) => `${n}:${label}`).join("|")}`;
    if (shows === pickerShows) return;
    pickerShows = shows;
    $("netuid").replaceChildren(
      new Option("Choose a subnet…", ""),
      ...labels.map(([n, label]) => new Option(label, n)),
    );
    $("netuid").value = selected ? String(selected) : "";
  }

  async function loadSubnetList() {
    try {
      const subnets = await getJSON("/api/subnets");
      subnetInfo = new Map(subnets.map((s) => [s.netuid, s]));
      rankedCount = subnets.filter((s) => s.price_rank !== null).length;
      emittingCount = subnets.filter((s) => s.emission_rank !== null).length;
      $("error").hidden = true;
      cards.forEach(showListStats); // ranks and emission shares move over time
    } catch (e) {
      $("error").textContent = `Couldn't load the subnet list: ${e.message}`;
      $("error").hidden = false;
    }
    updatePicker();
  }

  $("netuid").addEventListener("change", (e) => {
    selected = Number(e.target.value) || null;
    history.replaceState(null, "", selected ? `?netuid=${selected}` : location.pathname);
    layout();
    const card = cards.get(selected);
    if (card) {
      card.el.scrollIntoView({ block: "nearest" });
      card.el.classList.remove("flash");
      void card.el.offsetWidth; // restart the animation
      card.el.classList.add("flash");
    }
  });
  // The ring fills as the next update approaches, and spins while one runs.
  const RING = 2 * Math.PI * 9; // the <circle r="9"> all the way round
  let nextRefreshAt = Date.now() + REFRESH_MS;
  let refreshing = false;
  $("tick").querySelector(".ring").style.strokeDasharray = RING;

  function drawRing() {
    const left = Math.max(0, nextRefreshAt - Date.now());
    const filled = refreshing ? 0.25 : 1 - left / REFRESH_MS; // a quarter arc, spinning, while it loads
    $("tick").classList.toggle("busy", refreshing);
    $("tick").querySelector(".ring").style.strokeDashoffset = RING * (1 - filled);
    const label = refreshing ? "Updating…" : `Next update in ${Math.ceil(left / 1000)}s. Click to update now`;
    $("tick").title = label;
    $("tick").setAttribute("aria-label", label);
  }

  async function refreshAll() {
    if (refreshing) return;
    refreshing = true;
    nextRefreshAt = Date.now() + REFRESH_MS;
    drawRing();
    try {
      await Promise.all([...[...cards.values()].map(load), loadSubnetList()]);
    } finally {
      refreshing = false;
      drawRing();
    }
  }

  $("tick").addEventListener("click", refreshAll);
  setInterval(() => {
    if (document.visibilityState !== "visible") return; // paused in a background tab
    if (Date.now() >= nextRefreshAt) refreshAll();
    else drawRing();
    cards.forEach(paintEpoch); // the epoch bars move between refreshes
  }, 1000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() >= nextRefreshAt) refreshAll();
  });
  drawRing();

  $("sort").value = sortBy;
  $("sort").addEventListener("change", (e) => {
    sortBy = SORTS.includes(e.target.value) ? e.target.value : "netuid";
    try {
      localStorage.setItem(SORT_KEY, sortBy);
    } catch { /* storage blocked: the choice lasts this visit */ }
    updatePicker();
  });

  // Theme: Auto follows the device; Light/Dark are saved in this browser.
  const THEME_KEY = "subnet-viewer:theme";
  function applyTheme(choice) {
    if (choice === "light" || choice === "dark") document.documentElement.dataset.theme = choice;
    else delete document.documentElement.dataset.theme;
    document.querySelectorAll("[data-theme-choice]").forEach((button) =>
      button.setAttribute("aria-pressed", String(button.dataset.themeChoice === choice)));
  }
  let themeChoice = "system";
  try {
    themeChoice = localStorage.getItem(THEME_KEY) || "system";
  } catch { /* storage blocked */ }
  applyTheme(themeChoice);
  document.querySelectorAll("[data-theme-choice]").forEach((button) =>
    button.addEventListener("click", () => {
      themeChoice = button.dataset.themeChoice;
      try {
        localStorage.setItem(THEME_KEY, themeChoice);
      } catch { /* storage blocked: the choice lasts this visit */ }
      applyTheme(themeChoice);
    }));

  // Seed Lab needs a password: ask for it here, before leaving the dashboard.
  const loginDialog = $("login");
  async function openSeedLab() {
    let session = { enabled: true, logged_in: false };
    try {
      session = await getJSON("/api/seed-lab/session");
    } catch { /* show the box anyway; logging in reports any problem */ }
    if (session.logged_in) return location.assign("/seed-lab");
    $("login-fields").hidden = !session.enabled;
    $("login-disabled").hidden = session.enabled;
    $("login-submit").hidden = !session.enabled;
    $("login-cancel").textContent = session.enabled ? "Cancel" : "Close";
    $("login-error").hidden = true;
    $("login-password").value = "";
    loginDialog.showModal();
  }
  $("seed-lab-link").addEventListener("click", (e) => {
    if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return; // new tab: /seed-lab sends it back here
    e.preventDefault();
    openSeedLab();
  });
  $("login-cancel").addEventListener("click", () => loginDialog.close());

  // Coldkey label editor: Save (or an empty box) stores/clears the label, Remove clears it.
  $("label-cancel").addEventListener("click", () => $("label-dialog").close());
  $("burn-close").addEventListener("click", () => { burnReq++; $("burn-dialog").close(); });
  // The graph is drawn at the dialog's pixel size, so redraw it when the window resizes.
  let burnResize;
  addEventListener("resize", () => {
    clearTimeout(burnResize);
    burnResize = setTimeout(() => {
      if ($("burn-dialog").open && burnData) renderBurnChart($("burn-chart"), burnData);
      if ($("burn-dialog").open && regData) renderRegBars($("reg-bars"), regData);
    }, 150);
  });
  // Click on the backdrop (outside the dialog box) closes any modal.
  for (const id of ["burn-dialog", "label-dialog", "login"]) {
    $(id).addEventListener("click", (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) {
        e.currentTarget.close();
      }
    });
  }
  $("label-remove").addEventListener("click", () => {
    const address = $("label-dialog").dataset.address;
    labels.delete(address);
    saveLabels();
    refreshColdkeyLabels(address);
    $("label-dialog").close();
  });
  $("label-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const address = $("label-dialog").dataset.address;
    const value = $("label-input").value.trim();
    if (value) labels.set(address, value);
    else labels.delete(address);
    saveLabels();
    refreshColdkeyLabels(address);
    $("label-dialog").close();
  });
  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submit = $("login-submit");
    submit.disabled = true;
    try {
      await getJSON("/api/seed-lab/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: $("login-password").value }),
      });
      location.assign("/seed-lab");
    } catch (err) {
      submit.disabled = false;
      $("login-error").textContent = err.message;
      $("login-error").hidden = false;
      $("login-password").select();
    }
  });
  // /seed-lab sends visitors who aren't logged in here, with ?login=seed-lab.
  const pageUrl = new URL(location.href);
  if (pageUrl.searchParams.get("login") === "seed-lab") {
    pageUrl.searchParams.delete("login");
    history.replaceState(null, "", pageUrl);
    openSeedLab();
  }

  layout();
  loadSubnetList();
</script>
<script>
  // TAO's USD price in the nav bar, from the server's cached market-data read; refreshed
  // each minute, and simply left out if it can't be had.
  (function () {
    const chip = document.getElementById("tao-price");
    async function load() {
      try {
        const r = await fetch("/api/tao-price");
        if (!r.ok) throw new Error(r.status);
        const p = await r.json();
        document.getElementById("tao-usd").textContent =
          "$" + p.usd.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const change = document.getElementById("tao-change");
        const pct = p.change_24h_pct;
        change.textContent = pct == null ? "" : `${pct >= 0 ? "▲" : "▼"} ${Math.abs(pct).toFixed(2)}%`;
        change.className = pct == null ? "" : pct >= 0 ? "up" : "down";
        chip.title = `TAO price in US dollars (${p.source})` + (pct == null ? "" : `\n24h change: ${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%`);
        chip.hidden = false;
      } catch {
        chip.hidden = true;
      }
    }
    load();
    setInterval(load, 60_000);
  })();
</script>
</body>
